name: Bug report
description: Report a reproducible problem in AgriAI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please remove all passwords, API keys, personal data, and private files from your report."
  - type: textarea
    id: summary
    attributes:
      label: Bug description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ... 2. Tap ... 3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Redact credentials and personal information.
    validations:
      required: true
  - type: input
    id: flutter
    attributes:
      label: Flutter version
      placeholder: "Output of flutter --version"
  - type: input
    id: platform
    attributes:
      label: Device and operating system
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private information.
          required: true
