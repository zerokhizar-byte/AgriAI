name: agriai
description: "AgriAI - Smart Agriculture Application"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Local storage
  shared_preferences: ^2.5.3

  # Networking
  http: ^1.5.0

  # URLs / external news
  url_launcher: ^6.3.2

  # Image and video selection
  image_picker: ^1.2.3

  # Voice input
  speech_to_text: ^7.3.0

  # Voice output
  flutter_tts: ^4.2.3

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: 6.6.1
  cloud_firestore: ^6.0.2

  # Google authentication
  google_sign_in: ^7.2.0

  # Facebook authentication
  flutter_facebook_auth: ^7.2.0
  
  flutter_local_notifications: ^23.0.2
  # GPS / device location
  geolocator: ^14.0.2
  
  video_player: ^2.14.0
  firebase_remote_config: ^6.6.0
  firebase_analytics: ^12.5.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  firebase_messaging: ^16.7.0
  flutter_onnxruntime: ^1.8.3
  image: ^4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/agriai_logo.png
    - assets/animations/agriai_logo.mp4
    - assets/models/disease_model.onnx
    - assets/models/class_names.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/agriai_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/agriai_logo.png"
