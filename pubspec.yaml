name: agriai
description: "AgriAI - Smart Agriculture Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local storage
  shared_preferences: ^2.5.3

  # Networking
  http: ^1.5.0

  # Images
  image_picker: ^1.2.3

  # Firebase
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7

  # Google authentication
  google_sign_in: ^7.2.0

  # Facebook authentication
  flutter_facebook_auth: ^7.2.0

  # Device location
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/agriai_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/agriai_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/agriai_logo.png"